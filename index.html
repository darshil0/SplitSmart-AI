        transform: translateY(10px);

      .fade-enter-active {
        opacity: 1;
        transform: translateY(0);
        transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);

      /* Dark mode hint for UA */

      /* Prevent text selection on mobile, but allow inputs */

        user-select: none;
      }
      input,
      textarea,
      button {

        user-select: text;
      }

      /* iOS Safari focus fixes */
      input:focus,
      button:focus,
      textarea:focus {
        outline: none;
